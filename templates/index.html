<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Response Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .glow-red { filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.7)); }
        .glow-cyan { filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.6)); }
        .glow-green { filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.6)); }
        .deck-card {
            background: radial-gradient(circle at top left, #0e172a 0%, #060b18 100%);
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // View navigation: 'login', 'ops', 'scorecard'
            const [view, setView] = useState('login');
            const [operatorEmail, setOperatorEmail] = useState('cheekurthipravallika@gmail.com');
            const [inputEmail, setInputEmail] = useState('');

            // Live Simulator Metrics
            const [threatSeverity, setThreatSeverity] = useState(76);
            const [systemHealth, setSystemHealth] = useState(92);
            const [actionFeedback, setActionFeedback] = useState('Ready for incident containment decisions.');

            const handleLogin = (e) => {
                e.preventDefault();
                if (inputEmail.trim()) {
                    setOperatorEmail(inputEmail.trim());
                }
                setView('ops');
            };

            const triggerAction = (type) => {
                if (type === 'analyze') {
                    setActionFeedback('Traffic correlated: Event ID 4625 brute force cluster from 185.220.101.4 (Bucharest).');
                    setThreatSeverity(prev => Math.max(10, prev - 8));
                } else if (type === 'isolate') {
                    setActionFeedback('Host network isolated via EDR. Socket terminated; volatile RAM artifacts preserved per RFC 3227.');
                    setThreatSeverity(prev => Math.max(5, prev - 35));
                    setSystemHealth(prev => Math.min(99, prev + 4));
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Top System Header */}
                    <header className="border-b border-slate-800 bg-[#070d1d] px-6 py-3 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center space-x-3">
                            <div className="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center shadow-lg shadow-cyan-600/40">
                                <span className="text-white text-base font-bold">⚡</span>
                            </div>
                            <div>
                                <div className="flex items-center space-x-2">
                                    <h1 className="text-lg md:text-xl font-black tracking-wider text-white">INCIDENT RESPONSE SIMULATOR</h1>
                                    <span className="px-2 py-0.5 rounded text-[10px] font-mono tracking-widest bg-cyan-950 text-cyan-400 border border-cyan-700">
                                        LIVE DEFENSE CENTER
                                    </span>
                                </div>
                                <p className="text-xs text-slate-400 italic">“Every decision changes the incident.”</p>
                            </div>
                        </div>

                        {/* Top Right Controls & Operator Pill */}
                        <div className="flex items-center space-x-3">
                            {view !== 'login' && (
                                <div className="flex items-center space-x-2 bg-slate-900/90 border border-slate-700 rounded-lg p-1">
                                    <button 
                                        onClick={() => setView('ops')} 
                                        className={`px-3 py-1 rounded text-xs font-mono font-bold transition-all ${
                                            view === 'ops' ? 'bg-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                                        }`}
                                    >
                                        OPS DECK
                                    </button>
                                    <button 
                                        onClick={() => setView('scorecard')} 
                                        className={`px-3 py-1 rounded text-xs font-mono font-bold transition-all ${
                                            view === 'scorecard' ? 'bg-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                                        }`}
                                    >
                                        EXECUTIVE SCORECARD
                                    </button>
                                </div>
                            )}

                                <span className="text-xs font-mono text-slate-300">
                                    OPERATOR: <span className="text-cyan-300 font-bold">{operatorEmail}</span>
                                </span>
                                {view !== 'login' && (
                                    <button 
                                        onClick={() => setView('login')}
                                        className="text-xs font-mono text-slate-400 hover:text-rose-400 ml-2 pl-2 border-l border-slate-700"
                                    >
                                        Sign Out
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* MAIN VIEW ROUTING */}
                    <main className="flex-1 p-4 md:p-6 max-w-[1550px] mx-auto w-full">
                        {/* ========================================================================= */}
                        {/* PAGE 1: OPERATOR STATION LOGIN GATEWAY                                   */}
                        {/* ========================================================================= */}
                        {view === 'login' && (

                                        </span>
                                        <h2 className="text-2xl font-bold tracking-wide text-white mt-1">
                                            Operator Station Login

                                                type="email" 
                                                defaultValue={operatorEmail}
                                                onChange={(e) => setInputEmail(e.target.value)}

                                                required

                                            />
                                        </div>
                                        <div className="pt-2">
                                            <button 
                                                type="submit" 
                                                className="w-full py-3 px-4 rounded-lg bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-sm tracking-wider font-mono transition-all shadow-lg shadow-cyan-900/40 flex items-center justify-center space-x-2"

                                                <span>▶</span>
                                            </button>
                                        </div>
                                    </form>

                                    </div>
                                </div>
                            </div>

                        {/* ========================================================================= */}
                        {/* PAGE 2: LIVE OPERATIONS DECK                                             */}

                        {view === 'ops' && (

                                                    <span className="block text-[10px] text-slate-400 font-mono">Detection</span>
                                                    <span className="text-xs font-bold text-cyan-400 font-mono">12:45 PM</span>
                                                </div>
                                                <div className="bg-[#0b1328] p-2 rounded-lg border border-cyan-900/50">
                                                    <span className="block text-[10px] text-slate-400 font-mono">Analysis</span>
                                                    <span className="text-xs font-bold text-cyan-400 font-mono">1:10 PM</span>
                                                </div>
                                                <div className="bg-[#0b1328] p-2 rounded-lg border border-rose-900/50">

                                                    </div>
                                                    <span className="text-amber-400 font-bold w-8 text-right">3</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Neon Speedometer 1: Threat Severity (76% High) */}
                                    <div className="lg:col-span-3.5 deck-card rounded-2xl p-5 border border-slate-800 flex flex-col items-center justify-center text-center">
                                        <h3 className="text-sm font-bold text-slate-300 uppercase tracking-widest font-mono">Threat Severity</h3>
                                        <div className="relative w-52 h-40 flex items-center justify-center overflow-hidden my-2">
                                            <svg className="w-52 h-52 -rotate-90" viewBox="0 0 100 100">
                                                <circle cx="50" cy="50" r="38" stroke="#1e293b" strokeWidth="8" fill="transparent" />
                                                <circle cx="50" cy="50" r="38" stroke="#ef4444" strokeWidth="8" fill="transparent"
                                                    strokeDasharray="238.7" strokeDashoffset={238.7 - (238.7 * threatSeverity / 100)}
                                                    strokeLinecap="round" className="glow-red transition-all duration-700" />
                                            </svg>
                                            <div className="absolute flex flex-col items-center mt-3">
                                                <span className="text-xs font-mono text-slate-400">High</span>
                                                <span className="text-4xl font-black text-white font-mono tracking-tighter">{threatSeverity}%</span>
                                                <span className="text-[10px] font-mono text-rose-400 tracking-wider font-bold">CRITICAL</span>
                                            </div>
                                        </div>
                                        <div className="flex justify-between w-full text-[11px] font-mono text-slate-500 px-4">
                                            <span>Low</span>
                                            <span>High</span>
                                        </div>
                                    </div>

                                    {/* Neon Speedometer 2: System Health (92% Normal) */}
                                    <div className="lg:col-span-3.5 deck-card rounded-2xl p-5 border border-slate-800 flex flex-col items-center justify-center text-center">
                                        <h3 className="text-sm font-bold text-slate-300 uppercase tracking-widest font-mono">System Health</h3>
                                        <div className="relative w-52 h-40 flex items-center justify-center overflow-hidden my-2">
                                            <svg className="w-52 h-52 -rotate-90" viewBox="0 0 100 100">
                                                <circle cx="50" cy="50" r="38" stroke="#1e293b" strokeWidth="8" fill="transparent" />
                                                <circle cx="50" cy="50" r="38" stroke="#10b981" strokeWidth="8" fill="transparent"
                                                    strokeDasharray="238.7" strokeDashoffset={238.7 - (238.7 * systemHealth / 100)}
                                                    strokeLinecap="round" className="glow-green transition-all duration-700" />
                                            </svg>
                                            <div className="absolute flex flex-col items-center mt-3">
                                                <span className="text-xs font-mono text-slate-400">Normal</span>
                                                <span className="text-4xl font-black text-white font-mono tracking-tighter">{systemHealth}%</span>
                                                <span className="text-[10px] font-mono text-emerald-400 tracking-wider font-bold">STABLE</span>
                                            </div>
                                        </div>
                                        <div className="flex justify-between w-full text-[11px] font-mono text-slate-500 px-4">
                                            <span>Warning</span>
                                            <span>Critical</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Middle Operations Row: 3D Topology + Alert Statistics */}
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                                    {/* 3D Isometric Network Traffic Canvas */}
                                    <div className="lg:col-span-6 deck-card rounded-2xl p-5 border border-slate-800">
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="text-base font-bold text-white tracking-wide">Network Traffic</h3>
                                            <div className="flex space-x-3 text-[11px] font-mono">
                                                <span className="text-cyan-400">● Internal Network</span>
                                                <span className="text-rose-400">● Malicious IPs</span>
                                            </div>
                                        </div>
                                        <div className="h-64 w-full bg-[#050b18] rounded-xl relative overflow-hidden border border-slate-900 flex items-center justify-center">
                                            <svg className="w-full h-full" viewBox="0 0 500 240">
                                                <g stroke="#1e293b" strokeWidth="0.8" opacity="0.6">

                                                <path d="M 320,130 Q 380,80 430,140" fill="none" stroke="#06b6d4" strokeWidth="2" className="glow-cyan" />

                                                <text x="400" y="160" fill="#67e8f9" fontSize="10" fontFamily="monospace" fontWeight="bold">FIN-GATEWAY-01</text>

                                                <circle cx="320" cy="130" r="9" fill="#ef4444" className="glow-red animate-pulse" />

                                            </svg>
                                        </div>
                                    </div>

                                    {/* Alert Statistics Sparkline Cards */}
                                    <div className="lg:col-span-6 space-y-3">
                                        <h3 className="text-base font-bold text-white tracking-wide">Alert Statistics</h3>
